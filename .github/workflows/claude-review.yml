name: Claude Review

# PR이 열리거나 새로 푸시될 때 Claude(Sonnet 5.5)가 리뷰하고 결과를 PR 인라인 코멘트로 남긴다.
# 인증: 저장소 Secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token으로 발급한 구독 토큰)
# 수동 실행: Actions → Claude Review → Run workflow → 리뷰할 PR 번호 입력
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "리뷰할 PR 번호"
        required: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

concurrency:
  # 같은 PR에 연달아 푸시하면 이전 리뷰는 취소하고 최신 커밋만 리뷰한다.
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ env.PR_NUMBER }}"
          # 진단용: 리뷰를 건너뛴 이유를 로그로 확인한다. 원인을 찾으면 끈다.
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
