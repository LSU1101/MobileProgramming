name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Actions 탭 → Android → Run workflow: 현재 main으로 APK를 빌드해 Release로 올린다.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 설치된 앱을 덮어쓸 수 있도록 빌드할 때마다 versionCode를 올린다.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-${{ github.run_number }}"
          fi
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "검증 앱 $VERSION_NAME" \
            --notes "versionName $VERSION_NAME / versionCode $VERSION_CODE / commit ${GITHUB_SHA::7}"
